# Feature Adoption
# 14 checks

SAT-FEAT-VECTOR-SEARCH:
  title: Vector Search endpoints deployed
  category: Feature Adoption
  severity: low
  description: Vector Search enables semantic search and RAG applications natively in Databricks.
  recommendation: Evaluate Vector Search for AI/ML use cases requiring embedding similarity search.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/generative-ai/vector-search
  effort: Moderate (1–4 hrs)
  api_endpoint: /api/2.0/vector-search/endpoints
  benefits: |-
    Vector Search enables semantic search and RAG applications natively within your governed Databricks environment.
  portal_link: explore/data
SAT-FEAT-FEATURE-STORE:
  title: Feature Engineering tables in use
  category: Feature Adoption
  severity: low
  description: Feature Engineering provides centralized feature management with automatic lineage and serving.
  recommendation: Evaluate Databricks Feature Engineering for ML feature management and online serving.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/machine-learning/feature-store
  effort: Moderate (1–4 hrs)
  api_endpoint: /api/2.0/feature-store/feature-tables
  benefits: |-
    Feature Engineering provides centralized feature management with automatic lineage and real-time serving.
  portal_link: explore/data
SAT-FEAT-QUALITY-MON:
  title: Lakehouse quality monitors deployed
  category: Feature Adoption
  severity: low
  description: Lakehouse Monitors automatically track data quality drift and schema changes.
  recommendation: Deploy quality monitors on key tables to detect drift, anomalies, and schema changes.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/lakehouse-monitoring
  effort: Moderate (1–4 hrs)
  api_endpoint: /api/2.1/unity-catalog/tables/{name}/monitor
  benefits: Lakehouse Monitors automatically detect data quality drift, schema changes, and volume anomalies.
  portal_link: explore/data
