# Secret Scanning
# 7 checks

SAT-SCAN-NOTEBOOKS:
  title: Notebook source code secret scan
  category: Secret Scanning
  severity: critical
  description: |-
    Notebook source code is scanned for hardcoded secrets, API keys, tokens, and credentials using TruffleHog (800+ detectors).
  recommendation: |-
    Remove hardcoded secrets from notebooks. Use Databricks secret scopes (dbutils.secrets.get()) or environment variables.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets
  effort: Significant (1–3 days)
  api_endpoint: /api/2.0/workspace/list + /api/2.0/workspace/export
  benefits: |-
    Scanning notebook source code detects hardcoded secrets before they reach production or version control.
  portal_link: workspace
SAT-SCAN-CLUSTER-CONF:
  title: Cluster configuration secret scan
  category: Secret Scanning
  severity: critical
  description: Cluster spark_conf and spark_env_vars values are scanned for embedded secrets using TruffleHog.
  recommendation: Move secrets out of cluster configurations into Databricks secret scopes.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets
  effort: Moderate (1–4 hrs)
  api_endpoint: /api/2.0/clusters/list
  benefits: Scanning cluster configs detects embedded secrets in spark_conf and environment variables.
  portal_link: compute
SAT-SCAN-JOB-CONF:
  title: Job definition secret scan
  category: Secret Scanning
  severity: critical
  description: |-
    Job parameters, environment variables, and notebook task parameters are scanned for embedded secrets.
  recommendation: Use secret scopes or Azure Key Vault references instead of hardcoded credentials in jobs.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets
  effort: Moderate (1–4 hrs)
  api_endpoint: /api/2.1/jobs/list
  benefits: |-
    Scanning job definitions detects secrets in parameters, environment variables, and task configurations.
  portal_link: jobs
SAT-SCAN-INIT-GLOBAL:
  title: Global init script secret scan
  category: Secret Scanning
  severity: critical
  description: Global init script contents are scanned for hardcoded secrets using TruffleHog.
  recommendation: |-
    Replace hardcoded secrets in init scripts with dbutils.secrets.get() calls or Azure Key Vault-backed secret scopes.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/init-scripts/global
  effort: Moderate (1–4 hrs)
  api_endpoint: /api/2.0/global-init-scripts/{script_id}
  benefits: Scanning global init scripts detects hardcoded secrets that would be exposed on every cluster.
  portal_link: settings/workspace/advanced
SAT-SCAN-INIT-CLUSTER:
  title: Cluster init script secret scan
  category: Secret Scanning
  severity: critical
  description: Cluster-level init script contents (DBFS and workspace) are scanned for secrets using TruffleHog.
  recommendation: Remove secrets from init scripts. Use secret scopes or Azure Key Vault references.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/init-scripts/cluster-scoped
  effort: Moderate (1–4 hrs)
  api_endpoint: /api/2.0/dbfs/read + /api/2.0/workspace/export
  benefits: Scanning cluster init scripts detects secrets in startup code that runs on specific clusters.
  portal_link: compute
SAT-SCAN-DLT:
  title: DLT pipeline configuration secret scan
  category: Secret Scanning
  severity: high
  description: |-
    DLT pipeline cluster configs, library settings, and configuration maps are scanned for embedded secrets.
  recommendation: Use secret scopes for credentials in DLT pipeline configurations.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/delta-live-tables
  effort: Moderate (1–4 hrs)
  api_endpoint: /api/2.0/pipelines/{pipeline_id}
  benefits: |-
    Scanning DLT pipeline configs detects secrets embedded in cluster settings or library configurations.
  portal_link: pipelines
SAT-SCAN-SQL-WH:
  title: SQL warehouse configuration secret scan
  category: Secret Scanning
  severity: high
  description: SQL warehouse environment configurations are scanned for embedded secrets.
  recommendation: Remove any hardcoded credentials from SQL warehouse settings.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/compute/sql-warehouse/create-sql-warehouse
  effort: Quick Fix (5–15 min)
  api_endpoint: /api/2.0/sql/warehouses
  benefits: Scanning SQL warehouse configs detects secrets in environment settings.
  portal_link: sql/warehouses
