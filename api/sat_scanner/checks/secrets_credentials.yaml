# Secrets & Credentials
# 7 checks

SAT-SEC-1:
  title: Secret scopes configured for credential management
  category: Secrets & Credentials
  severity: high
  description: Hardcoded credentials in notebooks are a critical security risk.
  recommendation: Create secret scopes backed by Azure Key Vault or Databricks native secrets.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets
  effort: Moderate (1–4 hrs)
  api_endpoint: /api/2.0/secrets/scopes/list
  benefits: |-
    Secret scopes eliminate hardcoded credentials in notebooks, preventing accidental exposure in version control.
SAT-SEC-2:
  title: Production jobs owned by service principals (not users)
  category: Secrets & Credentials
  severity: medium
  description: Jobs owned by human users break when those users leave the organization.
  recommendation: Transfer all production job ownership to dedicated service principals.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/jobs
  effort: Significant (1–3 days)
  api_endpoint: /api/2.1/jobs/list
  benefits: |-
    Service principal job ownership ensures continuity when employees leave — personal accounts break automation.
  portal_link: jobs
SAT-SEC-SCOPE-ACL:
  title: Secret scopes have ACLs and use Key Vault backend
  category: Secrets & Credentials
  severity: medium
  description: |-
    Secret scopes without ACLs allow any workspace user to read secrets. Key Vault backend provides hardware-backed security.
  recommendation: Add ACLs to all secret scopes. Prefer Azure Key Vault backend over Databricks-native.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control
  effort: Moderate (1–4 hrs)
  api_endpoint: /api/2.0/secrets/scopes/list + /api/2.0/secrets/acls/list
  benefits: Secret scope ACLs restrict who can read secrets. Key Vault backend adds hardware-backed security.
SAT-SEC-ROTATION:
  title: Secrets rotated within 90 days
  category: Secrets & Credentials
  severity: high
  description: |-
    Secrets that have not been rotated in over 90 days are stale credentials.
    Long-lived secrets increase the window of exposure if they are compromised
    and may violate organizational rotation policies.
  recommendation: |-
    Implement a 90-day secret rotation policy. Use Azure Key Vault auto-rotation
    or scheduled jobs to rotate secrets and update Databricks secret scopes.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets
  effort: Moderate (1–4 hrs)
  api_endpoint: /api/2.0/secrets/scopes/list
  benefits: Regular secret rotation limits the window of exposure for compromised credentials.
  portal_link: secrets/scopes
SAT-SEC-UNUSED:
  title: No unused secret scopes with stale secrets
  category: Secrets & Credentials
  severity: low
  description: |-
    Secret scopes with no recent reads are likely orphaned. Stale secret scopes
    accumulate over time, expanding the attack surface and making security
    audits more difficult.
  recommendation: |-
    Audit secret scope usage via system tables. Remove or archive secret scopes
    that have not been accessed in 90 days.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets
  effort: Quick Fix (5–15 min)
  api_endpoint: /api/2.0/secrets/scopes/list
  benefits: Removing stale secret scopes shrinks the attack surface and simplifies security audits.
  portal_link: secrets/scopes
SAT-SEC-ENV-VARS:
  title: Cluster environment variables do not contain credentials
  category: Secrets & Credentials
  severity: high
  description: |-
    Cluster Spark environment variables containing credential patterns (API keys,
    passwords, connection strings) are visible in cluster configuration and
    logged in audit events, creating credential exposure risk.
  recommendation: |-
    Replace environment variable credentials with Databricks secret references
    ({{secrets/scope/key}}). Audit all cluster spark_env_vars for credential patterns.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets
  effort: Moderate (1–4 hrs)
  api_endpoint: /api/2.0/clusters/list
  benefits: Secret-backed credentials prevent exposure in cluster configs, audit logs, and API responses.
  portal_link: compute
SAT-SEC-GIT-CREDS:
  title: Git credentials audited and rotated
  category: Secrets & Credentials
  severity: high
  description: |-
    Git credentials stored in Databricks Repos allow workspace users to pull/push code.
    Stale or over-provisioned Git credentials increase attack surface if the workspace
    is compromised.
  recommendation: |-
    Review Git credentials for all users. Remove credentials for inactive users.
    Rotate Git PATs every 90 days and prefer fine-grained tokens with minimal scope.
  reference_url: https://learn.microsoft.com/en-us/azure/databricks/repos/repos-setup
  effort: Moderate (1–4 hrs)
  api_endpoint: /api/2.0/git-credentials
  benefits: Auditing Git credentials prevents stale tokens from becoming attack vectors if the workspace is compromised.
  portal_link: settings/user/developer
