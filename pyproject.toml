[project]
name = "clone-xs"
version = "0.8.0"
description = "Enterprise-grade Unity Catalog cloning toolkit for Databricks — clone, compare, sync, and manage catalogs from CLI, Web UI, or REST API."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Viral Patel"},
]
keywords = ["databricks", "unity-catalog", "clone", "data-engineering", "catalog-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "databricks-sdk>=0.20.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # Locale-aware synthetic data for the Demo Data Generator. Used to build
    # name / email / phone / address pools at generation time; the Faker
    # output is embedded in the generated SQL as `element_at(array(...))`
    # literals, so realistic-looking values land in target tables without
    # requiring any client-side row materialisation.
    "faker>=20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "httpx>=0.25.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]
nlp = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]
# Optional: real Zerobus runtime destination on the demo-data streaming
# tab. The package ships prebuilt wheels for Linux x86_64 / aarch64 and
# Windows x86_64 only — there are no macOS wheels at v1.2.0, so this
# extra is intentionally NOT pulled in by default. macOS users can
# either build from source (requires Rust toolchain) or use the
# 'Try with Zerobus' code snippet panel which works without the SDK.
zerobus = [
    "databricks-zerobus-ingest-sdk>=1.2.0; platform_system != 'Darwin'",
]
spark = [
    "databricks-connect>=14.0.0",
    "databricks-labs-dqx>=0.4.0",
]
# Optional: unstructured Document generation for the /demo-data
# Documents tab. Pure-Python deps — no system binaries required.
# The router lazily imports these so the API server starts cleanly
# without the extra installed; missing imports surface as a clean
# 503 dependencies_missing JSON response with an install hint.
documents = [
    "reportlab>=4.0.0",
    "python-docx>=1.0.0",
    "python-pptx>=0.6.21",
    "openpyxl>=3.1.0",
]
all = [
    "clone-xs[web,nlp,spark,dev,documents]",
]

[project.urls]
Homepage = "https://github.com/viral0216/clone-xs"
Repository = "https://github.com/viral0216/clone-xs"
Documentation = "https://github.com/viral0216/clone-xs#readme"
Issues = "https://github.com/viral0216/clone-xs/issues"
Changelog = "https://github.com/viral0216/clone-xs/blob/main/.github/CHANGELOG.md"

[project.scripts]
clxs = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
# Databricks notebook source files use runtime-injected globals (spark, dbutils)
# and IPython magics (%pip, %sql) that aren't valid standalone Python — they're
# linted by Databricks itself, not ruff. force-exclude is required so the
# excludes apply even when pre-commit passes file paths explicitly.
extend-exclude = ["notebooks"]
force-exclude = true

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["E402"]  # imports after app = FastAPI() for router registration

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
